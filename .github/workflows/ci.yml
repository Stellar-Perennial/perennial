# CI for this repository only: typecheck, build, unit tests.
# To run Perennial against your contracts, see examples/perennial-schedule.yml.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
